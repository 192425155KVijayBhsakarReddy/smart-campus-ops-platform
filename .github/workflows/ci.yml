name: Campus Platform CI/CD Delivery Pipeline

on:
  push:
    branches: [ master, main, 'defect/**', 'feature/**' ]
  pull_request:
    branches: [ master, main, 'defect/**', 'feature/**' ]

jobs:
  lint-and-validate:
    name: "Stage 1: Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install flake8
      - name: Run Flake8 Code Inspection
        run: flake8 campus_model.py tests/test_model.py --count --max-line-length=140 --ignore=E402 --statistics

  test-suite:
    name: "Stage 2: Automated Pytest Suite"
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pytest
        run: pip install pytest
      - name: Run Authoritative Pytest Suite (Domain & Adaptation Checks)
        run: python -m pytest tests/test_model.py tests/test_day4_adaptation.py -v --junitxml=test-results.xml
      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  security-scan:
    name: "Stage 3: Security & Vulnerability Scan"
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency Security Audit
        run: |
          pip install pip-audit
          pip-audit --desc on

  deploy-testbed:
    name: "Stage 4: Testbed Smoke Deployment"
    needs: [test-suite, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pytest & Requests for Smoke Gate
        run: pip install pytest
      - name: Validate Container Configuration and Build Smoke Image
        run: |
          docker compose config -q
          docker build -t smart-campus-backend:smoke -f backend/Dockerfile backend/
      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smart-campus-backend:smoke'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      - name: Launch Testbed Multi-Container Cluster
        run: |
          docker compose up -d db backend_1 nginx
          sleep 12
      - name: Database Migration Safety Check & Dry-Run Gate
        run: |
          docker compose exec -T backend_1 python manage.py makemigrations --check --dry-run
          docker compose exec -T backend_1 python manage.py migrate --check
          echo "Database migration safety check passed: zero unapplied or conflicting schema changes."
      - name: Execute Authenticated Post-Deployment Healthcheck Gate
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost/api/healthz/
      - name: Execute Live Multi-Container Integration Test Suite (Tier 3)
        run: |
          python -m pytest tests/test_live_platform.py -v
      - name: Teardown Staging Testbed
        if: always()
        run: docker compose down
