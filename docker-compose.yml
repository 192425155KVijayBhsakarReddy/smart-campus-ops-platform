services:
  db:
    image: postgres:16-alpine
    container_name: campus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_db
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartcampus-net

  backend-1:
    build: ./backend
    container_name: campus_backend_1
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-smartcampus-supersecret-production-key-2026!}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: campus_db
      DB_USER: campus_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_secure_pass}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/healthz/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartcampus-net

  backend-2:
    build: ./backend
    container_name: campus_backend_2
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-smartcampus-supersecret-production-key-2026!}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: campus_db
      DB_USER: campus_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_secure_pass}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/healthz/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartcampus-net

  frontend:
    build: ./frontend
    container_name: campus_frontend
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartcampus-net

  nginx:
    build: ./nginx
    container_name: campus_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartcampus-net

networks:
  smartcampus-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
